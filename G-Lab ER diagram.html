<style>
#erd { width:100%; overflow-x:auto; }
#erd svg { min-width:900px; }
#erd svg.erDiagram .divider path { stroke-opacity:0.4; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke:none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a4a' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    edgeLabelBackground: dark ? '#1a1a2e' : '#f8f8ff',
  },
  er: { diagramPadding: 30, layoutDirection: 'TB', minEntityWidth: 140, minEntityHeight: 36, entityPadding: 14, useMaxWidth: false }
});
const diagram = `erDiagram
  USER {
    int userId PK
    string name
    string email
    string password
    string role
    datetime createdAt
  }
  PRODUCT {
    int productId PK
    string name
    string description
    float price
    string category
    string brand
    int stock
    string imageURL
  }
  CART {
    int cartId PK
    int userId FK
    float totalPrice
  }
  CART_ITEM {
    int cartItemId PK
    int cartId FK
    int productId FK
    int quantity
  }
  ORDER {
    int orderId PK
    int userId FK
    float totalAmount
    string status
    datetime createdAt
  }
  ORDER_ITEM {
    int orderItemId PK
    int orderId FK
    int productId FK
    int quantity
    float price
  }
  PAYMENT {
    int paymentId PK
    int orderId FK
    int userId FK
    string method
    float amount
    string status
    string transactionId
  }
  DELIVERY {
    int deliveryId PK
    int orderId FK
    string address
    string status
    string trackingNumber
  }
  REVIEW {
    int reviewId PK
    int userId FK
    int productId FK
    int rating
    string comment
  }

  USER ||--o{ ORDER : "places"
  USER ||--|| CART : "has"
  USER ||--o{ REVIEW : "writes"
  USER ||--o{ PAYMENT : "makes"
  CART ||--o{ CART_ITEM : "contains"
  PRODUCT ||--o{ CART_ITEM : "in"
  ORDER ||--o{ ORDER_ITEM : "contains"
  PRODUCT ||--o{ ORDER_ITEM : "in"
  ORDER ||--|| PAYMENT : "paid via"
  ORDER ||--|| DELIVERY : "sent via"
  PRODUCT ||--o{ REVIEW : "receives"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
