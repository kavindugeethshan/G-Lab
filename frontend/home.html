<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Lab — High Performance Computer Hardware</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060b18;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-hover: rgba(30, 41, 59, 0.9);
            --card-border: rgba(59, 130, 246, 0.2);
            --card-hover-border: rgba(99, 102, 241, 0.5);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --purple-color: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.7);
        }

        html {
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* HEADER & NAVIGATION */
        header {
            background-color: rgba(10, 17, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-greeting {
            font-size: 0.88rem;
            color: var(--text-muted);
            background: rgba(30, 41, 59, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: rgba(30, 41, 59, 0.5);
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(148, 163, 184, 0.4);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--error-color);
            color: white;
        }

        /* CONTAINER & CARDS */
        .container {
            max-width: 1240px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .section-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
        }

        .section-card h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* TOAST MESSAGE */
        #message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            font-size: 0.92rem;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #message.error { display: block; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        #message.success { display: block; background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        #message.loading { display: block; background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }

        /* ADVANCED SEARCH & FILTER CONTROLS */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* PRODUCTS GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 22px;
            margin-bottom: 30px;
        }

        .product-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            background: var(--card-hover);
        }

        .product-img-box {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 12px;
            background: #0f172a;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .discount-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(239, 68, 68, 0.85);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .stock-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .stock-in { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .stock-low { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .stock-out { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .product-badge {
            font-size: 0.75rem;
            background: rgba(51, 65, 85, 0.6);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .product-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 8px 0 6px 0;
            line-height: 1.3;
        }

        .product-desc {
            font-size: 0.84rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .price-box {
            margin-bottom: 12px;
        }

        .price-current {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--success-color);
        }

        .price-original {
            font-size: 0.85rem;
            text-decoration: line-through;
            color: var(--text-muted);
            margin-left: 6px;
        }

        /* PAGINATION CONTROLS BAR */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 20px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .pagination-info {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .pagination-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-num-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .page-num-btn:hover:not(.active) {
            background: rgba(51, 65, 85, 0.5);
        }

        .page-num-btn.active {
            background: var(--accent-gradient);
            border-color: var(--accent-color);
            color: white;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .badge-pill {
            background: var(--accent-gradient);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 4px;
        }
    </style>
</head>

<body>

    <!-- HEADER / NAVIGATION -->
    <header>
        <div class="logo-title" onclick="window.location.href='home.html'">
            <div class="logo-icon">G</div>
            <div class="logo-text">
                <h1>G LAB</h1>
                <span>High Performance Hardware Store</span>
            </div>
        </div>
        <div class="nav-actions">
            <span class="user-greeting" id="userGreeting">Loading...</span>
            <button type="button" class="btn btn-outline" onclick="window.location.href='cart.html'">
                🛒 Cart <span class="badge-pill" id="cartBadge">0</span>
            </button>
            <button type="button" class="btn btn-outline" onclick="window.location.href='profile.html'">Profile</button>
            <button type="button" class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Toast Feedback Message -->
        <div id="message"></div>

        <!-- SEARCH & MULTI-FILTERING PANEL -->
        <div class="section-card">
            <h3>🔍 Search & Filter Products</h3>
            <div class="grid-inputs">
                <div class="form-group" style="grid-column: span 2;">
                    <label for="searchKeyword">Search Keyword (Name / Category / Brand)</label>
                    <input type="text" id="searchKeyword" placeholder="e.g. RTX 4090, ASUS, Gaming...">
                </div>
                <div class="form-group">
                    <label for="category">Category (Supports multi-comma filter)</label>
                    <input type="text" id="category" placeholder="e.g. Graphics Cards, Processors">
                </div>
                <div class="form-group">
                    <label for="brand">Brand (Supports multi-comma filter)</label>
                    <input type="text" id="brand" placeholder="e.g. ASUS, MSI, Intel">
                </div>
                <div class="form-group">
                    <label for="minPrice">Min Price (Rs.)</label>
                    <input type="number" id="minPrice" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="maxPrice">Max Price (Rs.)</label>
                    <input type="number" id="maxPrice" min="0" placeholder="Max">
                </div>
                <div class="form-group">
                    <label for="sortOption">Sort By</label>
                    <select id="sortOption" onchange="applyFilterAndSort()">
                        <option value="newest">Newest Arrivals</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="rating">Top Customer Ratings</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="limitOption">Items Per Page</label>
                    <select id="limitOption" onchange="changeLimit()">
                        <option value="10">10 per page</option>
                        <option value="20">20 per page</option>
                        <option value="50">50 per page</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn btn-outline" onclick="resetFilters()">Reset Filters</button>
                <button type="button" class="btn btn-primary" onclick="applyFilterAndSort()">Filter & Search</button>
            </div>
        </div>

        <!-- PRODUCTS DISPLAY LISTING GRID -->
        <div id="productList" class="product-grid">
            <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Loading catalog products...</p>
        </div>

        <!-- PAGINATION NAVIGATION BAR -->
        <div class="pagination-bar" id="paginationBar">
            <div class="pagination-info" id="paginationInfo">Showing 0 products</div>
            <div class="pagination-buttons" id="paginationButtons">
                <!-- Dynamic Page Buttons -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC ENGINE -->
    <script>
        const API_URL = (window.location.protocol.startsWith('http')) 
            ? `${window.location.protocol}//${window.location.hostname}:3001` 
            : "http://localhost:3001";

        const token = localStorage.getItem("token");
        if (!token) window.location.href = "First login page.html";

        let currentPage = 1;
        let itemsPerPage = 10;
        let totalProductsCount = 0;
        let totalPagesCount = 1;

        // User Display
        try {
            const rawUser = localStorage.getItem("user");
            if (rawUser) {
                const u = JSON.parse(rawUser);
                const name = u.firstname ? `${u.firstname} ${u.lastname || ''}` : (u.name || u.email || 'User');
                document.getElementById("userGreeting").textContent = `Hi, ${name}`;
            }
        } catch (_) {}

        function getHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        function setMessage(text, type) {
            const el = document.getElementById("message");
            if (!text) { el.style.display = "none"; return; }
            el.textContent = text;
            el.className = type || "";
            if (type === "success") {
                setTimeout(() => { if (el.textContent === text) el.style.display = "none"; }, 4000);
            }
        }

        async function loadProducts() {
            const search = document.getElementById("searchKeyword").value.trim();
            const category = document.getElementById("category").value.trim();
            const brand = document.getElementById("brand").value.trim();
            const minPrice = document.getElementById("minPrice").value.trim();
            const maxPrice = document.getElementById("maxPrice").value.trim();
            const sort = document.getElementById("sortOption").value;

            // Validate Price Range
            if (minPrice && maxPrice && Number(minPrice) > Number(maxPrice)) {
                setMessage("Minimum price cannot be greater than maximum price.", "error");
                return;
            }

            const params = new URLSearchParams();
            params.append("page", currentPage);
            params.append("limit", itemsPerPage);
            if (search) params.append("search", search);
            if (category) params.append("category", category);
            if (brand) params.append("brand", brand);
            if (minPrice) params.append("minPrice", minPrice);
            if (maxPrice) params.append("maxPrice", maxPrice);
            if (sort) params.append("sort", sort);

            setMessage("Loading products catalog...", "loading");

            try {
                const res = await fetch(`${API_URL}/products?${params.toString()}`, { headers: getHeaders() });
                const data = await res.json();

                if (!res.ok) throw new Error(data.message || `Failed (${res.status})`);

                const products = data.products || data.items || data || [];
                totalProductsCount = data.totalProducts !== undefined ? data.totalProducts : products.length;
                totalPagesCount = data.totalPages || Math.ceil(totalProductsCount / itemsPerPage) || 1;

                renderProductGrid(products);
                renderPaginationBar();

                setMessage(`Loaded page ${currentPage} (${products.length} products).`, "success");

            } catch (err) {
                console.error("loadProducts error:", err);
                setMessage(`Error loading products: ${err.message}`, "error");
                document.getElementById("productList").innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--error-color);">Failed to load products: ${err.message}</p>`;
            }
        }

        function renderProductGrid(products) {
            const container = document.getElementById("productList");

            if (!products || products.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No products match your search or filter parameters.</p>`;
                return;
            }

            container.innerHTML = products.map(p => {
                const pId = p._id || p.id;
                const origPrice = p.price || 0;
                const discount = p.discount || 0;
                const discPrice = discount > 0 ? Math.round(origPrice * (1 - discount / 100)) : origPrice;
                const stock = p.stock !== undefined ? p.stock : 0;
                const img = p.Image || p.image || 'https://via.placeholder.com/200x150?text=No+Image';

                let stockBadgeClass = 'stock-in';
                let stockText = `In Stock (${stock})`;
                if (stock === 0) {
                    stockBadgeClass = 'stock-out';
                    stockText = 'Out of Stock';
                } else if (stock <= 5) {
                    stockBadgeClass = 'stock-low';
                    stockText = `Low Stock (${stock} left)`;
                }

                return `
                    <div class="product-card">
                        <div>
                            <div class="product-img-box">
                                <img src="${img}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
                                ${discount > 0 ? `<span class="discount-badge">-${discount}% OFF</span>` : ''}
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span class="product-badge">${p.category || 'Hardware'}</span>
                                <span class="stock-badge ${stockBadgeClass}">${stockText}</span>
                            </div>
                            <h3 class="product-title">${p.name}</h3>
                            <p class="product-desc">${p.description || 'No description available'}</p>
                            <div class="price-box">
                                <span class="price-current">Rs. ${discPrice.toLocaleString()}</span>
                                ${discount > 0 ? `<span class="price-original">Rs. ${origPrice.toLocaleString()}</span>` : ''}
                            </div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
                                ⭐ Rating: <strong id="rating-${pId}">...</strong>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <button type="button" class="btn btn-outline" style="flex: 1;" onclick="viewProduct('${pId}')">Details</button>
                                <button type="button" class="btn btn-primary" style="flex: 1.2;" onclick="addToCart('${pId}')" ${stock === 0 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
                                    🛒 Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Load Rating async for each item
            products.forEach(async (p) => {
                const pId = p._id || p.id;
                if (!pId) return;
                try {
                    const res = await fetch(`${API_URL}/products/${pId}/rating`);
                    const data = await res.json();
                    const rEl = document.getElementById(`rating-${pId}`);
                    if (rEl) {
                        const val = data.averageRating !== undefined ? data.averageRating : (data.rating !== undefined ? data.rating : 0);
                        rEl.textContent = val > 0 ? `${val} / 5` : 'No ratings';
                    }
                } catch (_) {}
            });
        }

        // PAGINATION BAR RENDERER (Supports "Next 11 to 20 load karanawada" navigation)
        function renderPaginationBar() {
            const startItem = totalProductsCount > 0 ? (currentPage - 1) * itemsPerPage + 1 : 0;
            const endItem = Math.min(currentPage * itemsPerPage, totalProductsCount);

            document.getElementById("paginationInfo").textContent = `Showing items ${startItem} to ${endItem} of ${totalProductsCount} total products`;

            const buttonsContainer = document.getElementById("paginationButtons");
            let html = '';

            // Previous Button
            html += `<button type="button" class="btn btn-outline" style="padding: 6px 12px;" onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>← Prev</button>`;

            // Page Number Buttons
            for (let i = 1; i <= totalPagesCount; i++) {
                html += `<button type="button" class="page-num-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            // Next Button (Loads Next Set e.g. 11 to 20)
            html += `<button type="button" class="btn btn-outline" style="padding: 6px 12px;" onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPagesCount ? 'disabled' : ''}>Next →</button>`;

            buttonsContainer.innerHTML = html;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPagesCount) return;
            currentPage = page;
            loadProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeLimit() {
            itemsPerPage = Number(document.getElementById("limitOption").value) || 10;
            currentPage = 1;
            loadProducts();
        }

        function applyFilterAndSort() {
            currentPage = 1;
            loadProducts();
        }

        function resetFilters() {
            document.getElementById("searchKeyword").value = "";
            document.getElementById("category").value = "";
            document.getElementById("brand").value = "";
            document.getElementById("minPrice").value = "";
            document.getElementById("maxPrice").value = "";
            document.getElementById("sortOption").value = "newest";
            currentPage = 1;
            loadProducts();
        }

        async function fetchCartCount() {
            try {
                const res = await fetch(`${API_URL}/cart`, { headers: getHeaders() });
                const data = await res.json();
                if (res.ok) {
                    const badge = document.getElementById("cartBadge");
                    if (badge) badge.textContent = data.totalQuantity || data.itemCount || 0;
                }
            } catch (_) {}
        }

        async function addToCart(productId) {
            setMessage("Adding to cart...", "loading");
            try {
                const res = await fetch(`${API_URL}/cart/add`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({ productId, quantity: 1 })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Failed to add product");

                setMessage("Product added to cart! 🛒", "success");
                fetchCartCount();
            } catch (err) {
                setMessage(`Add to cart failed: ${err.message}`, "error");
            }
        }

        function viewProduct(id) {
            window.location.href = `product.html?id=${id}`;
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "First login page.html";
        }

        window.addEventListener("DOMContentLoaded", function () {
            loadProducts();
            fetchCartCount();
        });
    </script>
</body>

</html>
