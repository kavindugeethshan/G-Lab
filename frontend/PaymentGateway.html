<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Lab — Secure PayHere Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #060b18;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(59, 130, 246, 0.25);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .checkout-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 38px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 25px var(--accent-glow);
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .payment-details-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .total-amount-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .total-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .total-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--success-color);
        }

        .btn-payhere {
            width: 100%;
            padding: 16px;
            background: var(--success-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.35);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-payhere:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.5);
            filter: brightness(1.1);
        }

        .btn-cancel {
            width: 100%;
            padding: 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-cancel:hover {
            background: rgba(51, 65, 85, 0.8);
            color: var(--text-main);
        }

        #message {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            display: none;
        }

        #message.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        #message.loading {
            display: block;
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .sandbox-badge {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 6px;
            letter-spacing: 0.5px;
        }

        .detail-value {
            word-break: break-all;
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }

            .checkout-card {
                padding: 24px 18px;
                border-radius: 18px;
            }

            .brand-header h1 {
                font-size: 1.45rem;
            }

            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .total-amount-box {
                padding: 12px 14px;
            }

            .total-value {
                font-size: 1.35rem;
            }

            .btn-payhere {
                padding: 14px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <div class="checkout-card">
        <div class="brand-header">
            <div class="brand-logo">G</div>
            <h1>PayHere Checkout <span class="sandbox-badge">SANDBOX</span></h1>
            <p>Complete your e-commerce order securely</p>
        </div>

        <div id="message"></div>

        <div id="paymentContent">
            <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading payment parameters...</p>
        </div>
    </div>

    <!-- HIDDEN PAYHERE FORM SUBMISSION -->
    <form id="payHereForm" action="https://sandbox.payhere.lk/pay/checkout" method="POST" style="display: none;">
        <input type="hidden" name="merchant_id" id="ph_merchant_id">
        <input type="hidden" name="return_url" id="ph_return_url">
        <input type="hidden" name="cancel_url" id="ph_cancel_url">
        <input type="hidden" name="notify_url" id="ph_notify_url">
        <input type="hidden" name="order_id" id="ph_order_id">
        <input type="hidden" name="items" id="ph_items">
        <input type="hidden" name="currency" id="ph_currency">
        <input type="hidden" name="amount" id="ph_amount">
        <input type="hidden" name="first_name" id="ph_first_name">
        <input type="hidden" name="last_name" id="ph_last_name">
        <input type="hidden" name="email" id="ph_email">
        <input type="hidden" name="phone" id="ph_phone">
        <input type="hidden" name="address" id="ph_address">
        <input type="hidden" name="city" id="ph_city">
        <input type="hidden" name="country" id="ph_country" value="Sri Lanka">
        <input type="hidden" name="hash" id="ph_hash">
    </form>

    <script src="api-config.js"></script>
    <script>
        const API_URL = window.API_URL || (
            (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:3001'
                : window.location.origin
        );

        const token = localStorage.getItem("token");
        const params = new URLSearchParams(window.location.search);
        const paymentId = params.get("paymentId");

        function setMessage(text, type) {
            const el = document.getElementById("message");
            if (!text) { el.style.display = "none"; return; }
            el.textContent = text;
            el.className = type || "";
        }

        async function loadPaymentInfo() {
            if (!token) {
                setMessage("Authentication required. Redirecting to login...", "error");
                setTimeout(() => window.location.href = "index.html", 1500);
                return;
            }

            if (!paymentId) {
                document.getElementById("paymentContent").innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <p style="color: var(--error-color); margin-bottom: 16px;">⚠️ Payment ID not found in URL query string.</p>
                        <button class="btn-cancel" onclick="window.location.href='cart.html'">🛒 Return to Cart & Orders</button>
                    </div>
                `;
                return;
            }

            setMessage("Fetching payment details...", "loading");

            try {
                const res = await fetch(`${API_URL}/payments/${paymentId}`, {
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });

                const data = await res.json();

                if (!res.ok) {
                    if (res.status === 401) throw new Error("Authentication required. Please log in again.");
                    if (res.status === 403) throw new Error("Unauthorized access. You can only view payments for your own orders.");
                    if (res.status === 404) throw new Error("Payment not found or invalid payment ID.");
                    throw new Error(data.message || `Payment error (${res.status})`);
                }

                setMessage("", "");
                renderPaymentCard(data.payment);

            } catch (err) {
                console.error("loadPaymentInfo error:", err);
                setMessage(`Failed to load payment: ${err.message}`, "error");
                document.getElementById("paymentContent").innerHTML = `
                    <button class="btn-cancel" onclick="window.location.href='cart.html'">🛒 Return to Cart</button>
                `;
            }
        }

        function renderPaymentCard(payment) {
            const container = document.getElementById("paymentContent");
            const customer = payment.customer || {};
            const firstName = customer.first_name || customer.firstname || "Customer";
            const lastName = customer.last_name || customer.lastname || "User";
            const formattedAmount = Number(payment.amount).toFixed(2);

            container.innerHTML = `
                <div class="payment-details-box">
                    <div class="detail-row">
                        <span class="detail-label">Payment ID</span>
                        <span class="detail-value" style="font-family: monospace; font-size: 0.84rem;">${payment.id}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Order ID</span>
                        <span class="detail-value" style="font-family: monospace; font-size: 0.84rem;">${payment.orderId}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Customer Name</span>
                        <span class="detail-value">${firstName} ${lastName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${customer.email || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Payment Method</span>
                        <span class="detail-value" style="color: var(--accent-color);">${payment.gateway} (${payment.method})</span>
                    </div>
                </div>

                <div class="total-amount-box">
                    <span class="total-label">Payable Total</span>
                    <span class="total-value">Rs. ${Number(payment.amount).toLocaleString()} ${payment.currency}</span>
                </div>

                <button type="button" class="btn-payhere" onclick="submitToPayHere()">
                    💳 Proceed to PayHere Sandbox
                </button>
                <button type="button" class="btn-cancel" onclick="window.location.href='cart.html'">
                    ❌ Cancel & Return to Cart
                </button>
            `;

            // Populate hidden PayHere Sandbox form
            document.getElementById("ph_merchant_id").value = payment.merchantId;
            document.getElementById("ph_return_url").value = `${window.location.protocol}//${window.location.host}/cart.html`;
            document.getElementById("ph_cancel_url").value = `${window.location.protocol}//${window.location.host}/cart.html`;
            document.getElementById("ph_notify_url").value = payment.notifyUrl || `${API_URL}/payments/notify`;
            document.getElementById("ph_order_id").value = payment.orderId;
            document.getElementById("ph_items").value = `G-Lab Order #${payment.orderId}`;
            document.getElementById("ph_currency").value = payment.currency || "LKR";
            document.getElementById("ph_amount").value = formattedAmount;
            document.getElementById("ph_first_name").value = firstName;
            document.getElementById("ph_last_name").value = lastName;
            document.getElementById("ph_email").value = customer.email || "customer@example.com";
            document.getElementById("ph_phone").value = customer.phone || "0771234567";
            document.getElementById("ph_address").value = customer.address || "Main Street";
            document.getElementById("ph_city").value = customer.city || "Colombo";
            document.getElementById("ph_country").value = customer.country || "Sri Lanka";
            document.getElementById("ph_hash").value = payment.hash;
        }


        function submitToPayHere() {
            setMessage("Redirecting to PayHere Sandbox gateway...", "loading");
            document.getElementById("payHereForm").submit();
            //debug
            function submitToPayHere() {
                console.log("merchant_id:", document.getElementById("ph_merchant_id").value);
                console.log("order_id:", document.getElementById("ph_order_id").value);
                console.log("amount:", document.getElementById("ph_amount").value);
                console.log("currency:", document.getElementById("ph_currency").value);
                console.log("hash:", document.getElementById("ph_hash").value);
                console.log("notify_url:", document.getElementById("ph_notify_url").value);

                document.getElementById("payHereForm").submit();
            }
        }

        window.addEventListener("DOMContentLoaded", loadPaymentInfo);
    </script>
</body>

</html>
