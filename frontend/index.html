<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G Lab — Secure Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060b18;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(59, 130, 246, 0.25);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 42px 38px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 54px;
            height: 54px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 25px var(--accent-glow);
            margin-bottom: 14px;
        }

        .brand-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* TAB NAVIGATION */
        .tab-buttons {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.hidden {
            display: none;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.94rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 18px var(--accent-glow);
            transition: all 0.25s ease;
        }

        button.btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        #message {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.88rem;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #message.error { display: block; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        #message.success { display: block; background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        #message.loading { display: block; background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.82rem;
            color: var(--accent-color);
            text-decoration: none;
            margin-top: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }

            .login-box {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .brand-logo {
                width: 46px;
                height: 46px;
                font-size: 1.5rem;
            }

            .brand-header h1 {
                font-size: 1.55rem;
            }

            .tab-buttons {
                padding: 3px;
                margin-bottom: 22px;
            }

            .tab-btn {
                padding: 8px 4px;
                font-size: 0.78rem;
            }

            input {
                padding: 11px 13px;
                font-size: 0.88rem;
            }

            button.btn-submit {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="brand-header">
            <div class="brand-logo">G</div>
            <h1>G LAB</h1>
            <p id="subHeading">Sign in to your account</p>
        </div>

        <div class="tab-buttons">
            <button type="button" class="tab-btn active" id="btnTabLogin" onclick="switchMode('login')">Login</button>
            <button type="button" class="tab-btn" id="btnTabRegister" onclick="switchMode('register')">Register</button>
            <button type="button" class="tab-btn" id="btnTabForgot" onclick="switchMode('forgot')">Reset Password</button>
        </div>

        <form id="authForm" onsubmit="handleSubmit(event)">
            <!-- FIRST NAME -->
            <div class="form-group hidden" id="fgFirstName">
                <label for="firstname">First Name *</label>
                <input type="text" id="firstname" placeholder="John">
            </div>

            <!-- LAST NAME -->
            <div class="form-group hidden" id="fgLastName">
                <label for="lastname">Last Name *</label>
                <input type="text" id="lastname" placeholder="Doe">
            </div>

            <!-- EMAIL -->
            <div class="form-group" id="fgEmail">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>

            <!-- PASSWORD -->
            <div class="form-group" id="fgPassword">
                <label for="password">Password *</label>
                <input type="password" id="password" required placeholder="••••••••">
                <a class="forgot-link" id="linkForgot" onclick="switchMode('forgot')">Forgot password?</a>
            </div>

            <!-- CONFIRM PASSWORD (register only) -->
            <div class="form-group hidden" id="fgConfirmPassword">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
            </div>

            <!-- PROFILE IMAGE URL (register only) -->
            <div class="form-group hidden" id="fgImage">
                <label for="image">Avatar Image URL (Optional)</label>
                <input type="text" id="image" placeholder="https://example.com/avatar.jpg">
            </div>

            <!-- RESET TOKEN (forgot reset mode) -->
            <div class="form-group hidden" id="fgResetToken">
                <label for="resetToken">Password Reset Token *</label>
                <input type="text" id="resetToken" placeholder="Paste reset token from email/console">
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Sign In</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const API_URL = window.location.hostname.includes("trycloudflare.com")
            ? "https://hosted-protection-participant-wishing.trycloudflare.com"
            : (window.location.protocol.startsWith("http"))
                ? `${window.location.protocol}//${window.location.hostname}:3001`
                : "http://192.168.1.43:3001";

        let currentMode = "login"; // "login" | "register" | "forgot" | "reset"

        function setMessage(text, type) {
            const el = document.getElementById("message");
            if (!text) { el.style.display = "none"; return; }
            el.textContent = text;
            el.className = type || "";
        }

        function switchMode(mode) {
            currentMode = mode;
            setMessage("", "");

            document.getElementById("btnTabLogin").classList.toggle("active", mode === "login");
            document.getElementById("btnTabRegister").classList.toggle("active", mode === "register");
            document.getElementById("btnTabForgot").classList.toggle("active", mode === "forgot" || mode === "reset");

            const fgFirst = document.getElementById("fgFirstName");
            const fgLast = document.getElementById("fgLastName");
            const fgConfirm = document.getElementById("fgConfirmPassword");
            const fgImage = document.getElementById("fgImage");
            const fgPass = document.getElementById("fgPassword");
            const fgToken = document.getElementById("fgResetToken");
            const linkForgot = document.getElementById("linkForgot");
            const btnSubmit = document.getElementById("btnSubmit");
            const subHeading = document.getElementById("subHeading");

            // Hide all extras by default
            fgFirst.classList.add("hidden");
            fgLast.classList.add("hidden");
            fgConfirm.classList.add("hidden");
            fgImage.classList.add("hidden");
            fgToken.classList.add("hidden");
            fgPass.classList.remove("hidden");
            linkForgot.style.display = "none";

            if (mode === "login") {
                subHeading.textContent = "Sign in to your account";
                btnSubmit.textContent = "Sign In";
                linkForgot.style.display = "block";
            } else if (mode === "register") {
                subHeading.textContent = "Create a new G Lab account";
                btnSubmit.textContent = "Create Account";
                fgFirst.classList.remove("hidden");
                fgLast.classList.remove("hidden");
                fgConfirm.classList.remove("hidden");
                fgImage.classList.remove("hidden");
            } else if (mode === "forgot") {
                subHeading.textContent = "Request a password reset token";
                btnSubmit.textContent = "Send Reset Request";
                fgPass.classList.add("hidden");
            } else if (mode === "reset") {
                subHeading.textContent = "Enter new password & reset token";
                btnSubmit.textContent = "Reset Password Now";
                fgToken.classList.remove("hidden");
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            setMessage("", "");

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            // 1. LOGIN MODE (POST /users/login)
            if (currentMode === "login") {
                if (!email || !password) {
                    setMessage("Email and password are required.", "error");
                    return;
                }

                setMessage("Authenticating...", "loading");
                try {
                    const res = await fetch(`${API_URL}/users/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.message || `Login failed (${res.status})`);

                    // Save JWT token & User
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));

                    setMessage("Login successful! Redirecting...", "success");

                    setTimeout(() => {
                        if (data.user && data.user.isadmin) {
                            window.location.href = "admin.html";
                        } else {
                            window.location.href = "home.html";
                        }
                    }, 1000);

                } catch (err) {
                    setMessage(`Login failed: ${err.message}`, "error");
                }
            }

            // 2. REGISTER MODE (POST /users/create)
            else if (currentMode === "register") {
                const firstname = document.getElementById("firstname").value.trim();
                const lastname = document.getElementById("lastname").value.trim();
                const confirmPassword = document.getElementById("confirmPassword").value;
                const Image = document.getElementById("image").value.trim();

                if (!firstname) {
                    setMessage("First name is required.", "error");
                    return;
                }
                if (firstname.length < 2 || firstname.length > 50) {
                    setMessage("First name must be between 2 and 50 characters.", "error");
                    return;
                }

                if (!lastname) {
                    setMessage("Last name is required.", "error");
                    return;
                }
                if (lastname.length < 2 || lastname.length > 50) {
                    setMessage("Last name must be between 2 and 50 characters.", "error");
                    return;
                }

                if (!email) {
                    setMessage("Email address is required.", "error");
                    return;
                }
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    setMessage("Please enter a valid email address.", "error");
                    return;
                }

                if (!password) {
                    setMessage("Password is required.", "error");
                    return;
                }
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
                if (!passwordRegex.test(password)) {
                    setMessage("Password must be at least 8 characters long and contain uppercase, lowercase, and a number.", "error");
                    return;
                }

                if (password !== confirmPassword) {
                    setMessage("Passwords do not match.", "error");
                    return;
                }

                const btnSubmit = document.getElementById("btnSubmit");
                btnSubmit.disabled = true;
                btnSubmit.textContent = "Creating account...";
                setMessage("Creating account...", "loading");

                try {
                    const res = await fetch(`${API_URL}/users/create`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            firstname,
                            lastname,
                            email,
                            password,
                            ...(Image ? { Image } : {})
                        })
                    });

                    let data = null;
                    const contentType = res.headers.get("content-type");
                    if (contentType && contentType.includes("application/json")) {
                        try {
                            data = await res.json();
                        } catch (e) {
                            data = null;
                        }
                    }

                    if (!res.ok) {
                        if (res.status === 409) {
                            throw new Error((data && data.message) || "User already exists");
                        } else if (res.status === 400) {
                            throw new Error((data && data.message) || "Invalid registration data.");
                        } else if (res.status === 502 || res.status === 504) {
                            throw new Error(`Server unavailable (Cloudflare ${res.status}). Please try again later.`);
                        } else if (res.status >= 500) {
                            throw new Error((data && data.message) || `Server error (${res.status}). Please try again later.`);
                        } else {
                            throw new Error((data && data.message) || `Registration failed (${res.status}).`);
                        }
                    }

                    setMessage("Account created successfully", "success");
                    document.getElementById("authForm").reset();
                    setTimeout(() => switchMode("login"), 1800);

                } catch (err) {
                    let errText = err.message || "Registration failed.";
                    if (err.name === "TypeError" || errText.includes("Failed to fetch")) {
                        errText = "Network failure: Unable to connect to server.";
                    }
                    setMessage(errText, "error");
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = currentMode === "register" ? "Create Account" : "Sign In";
                }
            }

            // 3. FORGOT PASSWORD REQUEST (POST /users/forgot-password)
            else if (currentMode === "forgot") {
                if (!email) {
                    setMessage("Please enter your registered email address.", "error");
                    return;
                }

                setMessage("Requesting password reset token...", "loading");
                try {
                    const res = await fetch(`${API_URL}/users/forgot-password`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.message || "Failed to request reset token");

                    const tokenStr = data.token ? `Reset Token: ${data.token}` : '';
                    setMessage(`Reset token generated! ${tokenStr}`, "success");
                    
                    // Pre-fill token if provided in response for easy testing
                    if (data.token) {
                        document.getElementById("resetToken").value = data.token;
                    }
                    setTimeout(() => switchMode("reset"), 2000);

                } catch (err) {
                    setMessage(`Reset request failed: ${err.message}`, "error");
                }
            }

            // 4. RESET PASSWORD EXECUTION (POST /users/reset-password/:token)
            else if (currentMode === "reset") {
                const tokenVal = document.getElementById("resetToken").value.trim();
                if (!tokenVal || !password) {
                    setMessage("Reset token and new password are required.", "error");
                    return;
                }

                setMessage("Resetting password...", "loading");
                try {
                    const res = await fetch(`${API_URL}/users/reset-password/${tokenVal}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.message || "Password reset failed");

                    setMessage("Password reset successfully! Please log in with your new password.", "success");
                    setTimeout(() => switchMode("login"), 1800);

                } catch (err) {
                    setMessage(`Reset failed: ${err.message}`, "error");
                }
            }
        }
    </script>
</body>

</html>
