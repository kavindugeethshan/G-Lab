<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>G Lab — Shopping Cart & Orders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        html {
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            cursor: pointer;
        }

        .logo-title span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .section-card h2,
        .section-card h3 {
            font-size: 1.25rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background: none;
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: #334155;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border-color: var(--error-color);
        }

        .btn-danger:hover {
            background-color: var(--error-color);
            color: white;
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        #message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
        }

        #message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        #message.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        #message.loading {
            display: block;
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .cart-table th,
        .cart-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-table th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .cart-item-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #0f172a;
        }

        .cart-qty-input {
            width: 60px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            text-align: center;
        }

        .cart-summary {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .total-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--success-color);
        }

        .order-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-title" onclick="window.location.href='home.html'">
            <h1>G Lab</h1>
            <span>Computer Parts & Accessories</span>
        </div>
        <div class="nav-actions">
            <button type="button" class="btn btn-outline" onclick="window.location.href='home.html'">Back to Products</button>
            <button type="button" class="btn btn-outline" onclick="window.location.href='profile.html'">Profile</button>
            <button type="button" class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div id="message"></div>

        <!-- SECTION 1: SHOPPING CART -->
        <div class="section-card">
            <h2>🛒 My Shopping Cart</h2>
            <div id="cartContent">
                <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading your cart...</p>
            </div>
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div>
                    <span>Total Amount: </span>
                    <span class="total-price" id="cartGrandTotal">Rs. 0</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
                    <button type="button" class="btn btn-success" style="font-size: 1rem; padding: 12px 24px;" onclick="createOrderFromCart()">💳 Checkout & Place Order</button>
                </div>
            </div>
        </div>

        <!-- SECTION 2: MY ORDERS HISTORY (GET /order/my-orders) -->
        <div class="section-card">
            <h2>📦 My Order History</h2>
            <div style="margin-bottom: 15px;">
                <button type="button" class="btn btn-outline" onclick="loadMyOrders()">Refresh Order History</button>
            </div>
            <div id="myOrdersContainer">
                <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading your past orders...</p>
            </div>
        </div>

        <!-- SECTION 3: SEARCH ORDER BY ID (GET /order/:id) -->
        <div class="section-card">
            <h3>🔍 Find Specific Order By ID (GET /order/:id)</h3>
            <div class="grid-inputs" style="grid-template-columns: 1fr auto; align-items: end;">
                <div class="form-group">
                    <label for="searchOrderId">Order ID</label>
                    <input type="text" id="searchOrderId" placeholder="Enter Order ID (e.g. 64a1b2c3...)">
                </div>
                <button type="button" class="btn btn-primary" style="height: 42px;" onclick="searchOrderById()">Search Order</button>
            </div>
            <div id="singleOrderResult" style="margin-top: 15px; display: none;"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://192.168.1.43:3001";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "First login page.html";
        }

        function getHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        function setMessage(text, type) {
            const el = document.getElementById("message");
            if (!text) {
                el.style.display = "none";
                return;
            }
            el.textContent = text;
            el.className = type || "";
            console.log(`[Status:${type || "info"}]`, text);
        }

        // ----------------------------------------------------
        // 1. SHOPPING CART FUNCTIONS (GET /cart, PUT /cart/update/:id, DELETE /cart/remove/:id, DELETE /cart/clear)
        // ----------------------------------------------------
        async function loadCart() {
            try {
                const response = await fetch(`${API_URL}/cart`, {
                    method: "GET",
                    headers: getHeaders()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || `Failed to fetch cart (${response.status})`);
                }

                renderCart(data.items || [], data.total || 0);

            } catch (err) {
                console.error("loadCart error:", err);
                document.getElementById("cartContent").innerHTML = `<p style="color: var(--error-color); text-align: center;">Error loading cart: ${err.message}</p>`;
            }
        }

        function renderCart(items, total) {
            const cartContent = document.getElementById("cartContent");
            const cartSummary = document.getElementById("cartSummary");
            const grandTotal = document.getElementById("cartGrandTotal");

            if (!items || items.length === 0) {
                cartContent.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 30px 0;">Your shopping cart is empty.</p>`;
                cartSummary.style.display = "none";
                return;
            }

            cartSummary.style.display = "flex";
            grandTotal.textContent = `Rs. ${total.toLocaleString()}`;

            let html = `
                <div style="overflow-x: auto;">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            items.forEach(item => {
                const product = item.product || {};
                const pId = product._id || item.product;
                const pName = product.name || "Product";
                const pImg = product.Image || product.image || 'https://via.placeholder.com/50?text=No+Image';
                const origPrice = item.originalPrice || product.price || 0;
                const discPrice = item.discountedPrice || origPrice;
                const discount = item.discount || 0;
                const itemTotal = item.itemTotal || (discPrice * item.quantity);

                html += `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="${pImg}" class="cart-item-img" alt="${pName}" onerror="this.src='https://via.placeholder.com/50?text=No+Image'">
                                <div>
                                    <strong>${pName}</strong>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">ID: ${pId}</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <strong style="color: var(--success-color);">Rs. ${discPrice.toLocaleString()}</strong>
                            ${discount > 0 ? `<br><span style="text-decoration: line-through; color: var(--text-muted); font-size: 0.8rem;">Rs. ${origPrice}</span> <span style="color: #ef4444; font-size: 0.75rem;">(-${discount}%)</span>` : ''}
                        </td>
                        <td>
                            <input type="number" class="cart-qty-input" value="${item.quantity}" min="1" onchange="updateCartQuantity('${pId}', this.value)">
                        </td>
                        <td>
                            <strong style="color: var(--success-color);">Rs. ${itemTotal.toLocaleString()}</strong>
                        </td>
                        <td>
                            <button type="button" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="removeFromCart('${pId}')">🗑️ Remove</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            cartContent.innerHTML = html;
        }

        async function updateCartQuantity(productId, newQty) {
            const quantity = Number(newQty);
            if (!quantity || quantity < 1) return;

            setMessage("Updating cart quantity...", "loading");
            try {
                const response = await fetch(`${API_URL}/cart/update/${productId}`, {
                    method: "PUT",
                    headers: getHeaders(),
                    body: JSON.stringify({ quantity })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Failed to update quantity");

                setMessage("Cart updated!", "success");
                loadCart();

            } catch (err) {
                console.error("updateCartQuantity error:", err);
                setMessage(`Update failed: ${err.message}`, "error");
                loadCart();
            }
        }

        async function removeFromCart(productId) {
            if (!confirm("Remove this item from your cart?")) return;

            setMessage("Removing item from cart...", "loading");
            try {
                const response = await fetch(`${API_URL}/cart/remove/${productId}`, {
                    method: "DELETE",
                    headers: getHeaders()
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Failed to remove item");

                setMessage("Item removed from cart!", "success");
                loadCart();

            } catch (err) {
                console.error("removeFromCart error:", err);
                setMessage(`Remove failed: ${err.message}`, "error");
            }
        }

        async function clearCart() {
            if (!confirm("Are you sure you want to clear your entire cart?")) return;

            setMessage("Clearing cart...", "loading");
            try {
                const response = await fetch(`${API_URL}/cart/clear`, {
                    method: "DELETE",
                    headers: getHeaders()
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Failed to clear cart");

                setMessage("Cart cleared!", "success");
                loadCart();

            } catch (err) {
                console.error("clearCart error:", err);
                setMessage(`Clear cart failed: ${err.message}`, "error");
            }
        }

        // ----------------------------------------------------
        // 2. CREATE ORDER (POST /order)
        // ----------------------------------------------------
        async function createOrderFromCart() {
            if (!confirm("Are you sure you want to checkout and place your order?")) return;

            setMessage("Creating your order...", "loading");

            try {
                const response = await fetch(`${API_URL}/order`, {
                    method: "POST",
                    headers: getHeaders()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || `Failed to create order (${response.status})`);
                }

                setMessage("🎉 Order created successfully! Thank you for your purchase.", "success");
                loadCart();
                loadMyOrders();

            } catch (err) {
                console.error("createOrder error:", err);
                setMessage(`Create order failed: ${err.message}`, "error");
            }
        }

        // ----------------------------------------------------
        // 3. GET MY ORDERS (GET /order/my-orders)
        // ----------------------------------------------------
        async function loadMyOrders() {
            const container = document.getElementById("myOrdersContainer");
            container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading your orders...</p>`;

            try {
                const response = await fetch(`${API_URL}/order/my-orders`, {
                    method: "GET",
                    headers: getHeaders()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || `Failed to fetch orders (${response.status})`);
                }

                const orders = data.orders || [];

                if (orders.length === 0) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 25px 0;">You have not placed any orders yet.</p>`;
                    return;
                }

                let html = "";
                orders.forEach(order => {
                    const orderDate = new Date(order.createdAt || Date.now()).toLocaleString();
                    const status = order.Orderstatus || "Pending";
                    const statusColor = getStatusBadgeStyle(status);
                    const addr = order.Diliveryaddress || {};
                    const addressStr = [addr.addressLine, addr.city, addr.district, addr.postalCode].filter(Boolean).join(", ") || "No address provided";

                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <strong style="color: var(--accent-color);">Order #${order._id}</strong>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">${orderDate}</div>
                                </div>
                                <div>
                                    <span class="status-badge" style="background: ${statusColor.bg}; color: ${statusColor.text};">${status}</span>
                                </div>
                            </div>
                            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">
                                📍 <strong>Delivery Address:</strong> ${addressStr}
                            </div>
                            <div style="margin-bottom: 10px;">
                                <strong style="font-size: 0.9rem;">Products Ordered:</strong>
                                <ul style="margin-left: 20px; font-size: 0.85rem; margin-top: 6px;">
                                    ${(order.Products || []).map(p => `<li>${p.name} (x${p.quantity}) — <span style="color: var(--success-color);">Rs. ${(p.price * p.quantity).toLocaleString()}</span></li>`).join('')}
                                </ul>
                            </div>
                            <div style="text-align: right; font-size: 1.1rem; font-weight: 700; color: var(--success-color);">
                                Total: Rs. ${(order.Total || 0).toLocaleString()}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error("loadMyOrders error:", err);
                container.innerHTML = `<p style="color: var(--error-color); text-align: center;">Error loading orders: ${err.message}</p>`;
            }
        }

        function getStatusBadgeStyle(status) {
            switch (status) {
                case "Confirmed": return { bg: "rgba(59, 130, 246, 0.2)", text: "#3b82f6" };
                case "Shipped": return { bg: "rgba(168, 85, 247, 0.2)", text: "#a855f7" };
                case "Delivered": return { bg: "rgba(16, 185, 129, 0.2)", text: "#10b981" };
                case "Cancelled": return { bg: "rgba(239, 68, 68, 0.2)", text: "#ef4444" };
                default: return { bg: "rgba(245, 158, 11, 0.2)", text: "#f59e0b" }; // Pending
            }
        }

        // ----------------------------------------------------
        // 4. GET ORDER BY ID (GET /order/:id)
        // ----------------------------------------------------
        async function searchOrderById() {
            const orderId = document.getElementById("searchOrderId").value.trim();

            if (!orderId) {
                setMessage("Please enter a valid Order ID to search.", "error");
                return;
            }

            setMessage("Fetching order details...", "loading");

            try {
                const response = await fetch(`${API_URL}/order/${orderId}`, {
                    method: "GET",
                    headers: getHeaders()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || `Order not found (${response.status})`);
                }

                const order = data.order || data;
                const resultDiv = document.getElementById("singleOrderResult");
                resultDiv.style.display = "block";

                const orderDate = new Date(order.createdAt || Date.now()).toLocaleString();
                const status = order.Orderstatus || "Pending";
                const statusColor = getStatusBadgeStyle(status);
                const addr = order.Diliveryaddress || {};
                const addressStr = [addr.addressLine, addr.city, addr.district, addr.postalCode].filter(Boolean).join(", ") || "No address provided";

                resultDiv.innerHTML = `
                    <div class="order-card" style="border-color: var(--accent-color);">
                        <div class="order-header">
                            <div>
                                <strong style="color: var(--accent-color); font-size: 1.1rem;">Order #${order._id}</strong>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">${orderDate}</div>
                            </div>
                            <div>
                                <span class="status-badge" style="background: ${statusColor.bg}; color: ${statusColor.text};">${status}</span>
                            </div>
                        </div>
                        <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">
                            📍 <strong>Delivery Address:</strong> ${addressStr}
                        </div>
                        <div style="margin-bottom: 10px;">
                            <strong style="font-size: 0.95rem;">Products Included:</strong>
                            <ul style="margin-left: 20px; font-size: 0.9rem; margin-top: 6px;">
                                ${(order.Products || []).map(p => `<li>${p.name} (x${p.quantity}) — Rs. ${(p.price * p.quantity).toLocaleString()}</li>`).join('')}
                            </ul>
                        </div>
                        <div style="text-align: right; font-size: 1.2rem; font-weight: 700; color: var(--success-color);">
                            Total Paid: Rs. ${(order.Total || 0).toLocaleString()}
                        </div>
                    </div>
                `;

                setMessage(`Order #${order._id} found!`, "success");

            } catch (err) {
                console.error("searchOrderById error:", err);
                setMessage(`Search failed: ${err.message}`, "error");
                document.getElementById("singleOrderResult").style.display = "none";
            }
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "First login page.html";
        }

        window.addEventListener("DOMContentLoaded", function () {
            loadCart();
            loadMyOrders();
        });
    </script>
</body>

</html>
