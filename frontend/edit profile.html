<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>G Lab — Edit Profile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    html {
      overflow-y: scroll;
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .edit-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 35px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .edit-card h2 {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .preview-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
      margin-bottom: 10px;
      display: block;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background: none;
      border-color: var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background-color: #334155;
    }

    #msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    #msg.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      border: 1px solid var(--success-color);
    }
  </style>
</head>

<body>
  <div class="edit-card">
    <h2>Edit Profile</h2>

    <form id="editProfileForm">
      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
      </div>

      <div class="form-group">
        <label for="lastname">Last Name</label>
        <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
      </div>

      <div class="form-group">
        <label for="Email">Email Address</label>
        <input type="email" id="Email" name="Email" placeholder="email@example.com" required>
      </div>

      <div class="form-group">
        <label for="avatar">Profile Picture URL</label>
        <input type="text" id="avatar" name="avatar" placeholder="https://example.com/image.jpg">
      </div>

      <div id="msg"></div>

      <div class="action-buttons">
        <button type="button" class="btn btn-outline" onclick="window.location.href='profile.html'">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
      </div>
    </form>
  </div>

  <script>
    const API_URL = "http://192.168.1.43:3001";
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "First login page.html";
    }

    async function loadProfileForEdit() {
      try {
        const response = await fetch(`${API_URL}/users/profile`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await response.json();
        if (response.ok && data.user) {
          populateFields(data.user);
          localStorage.setItem("user", JSON.stringify(data.user));
        } else {
          loadFromLocal();
        }
      } catch (err) {
        console.error("Error fetching profile for edit:", err);
        loadFromLocal();
      }
    }

    function loadFromLocal() {
      try {
        const rawUser = localStorage.getItem("user");
        if (rawUser) {
          populateFields(JSON.parse(rawUser));
        }
      } catch (e) {}
    }

    function populateFields(user) {
      document.getElementById("firstname").value = user.firstname || "";
      document.getElementById("lastname").value = user.lastname || "";
      document.getElementById("Email").value = user.email || "";
      document.getElementById("avatar").value = user.Image || user.image || user.avatar || user.profilePic || "";
    }

    function showMsg(text, type) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = type;
    }

    document.getElementById("editProfileForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const firstname = document.getElementById("firstname").value.trim();
      const lastname = document.getElementById("lastname").value.trim();
      const email = document.getElementById("Email").value.trim();
      const image = document.getElementById("avatar").value.trim();

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      showMsg("Saving changes...", "loading");

      try {
        const response = await fetch(`${API_URL}/users/profile`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ firstname, lastname, email, image })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || `Update failed (${response.status})`);
        }

        if (data.user) {
          localStorage.setItem("user", JSON.stringify(data.user));
        }

        showMsg("Profile updated successfully! Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "profile.html";
        }, 800);

      } catch (err) {
        console.error("Update profile error:", err);
        showMsg(`Error: ${err.message}`, "error");
        saveBtn.disabled = false;
      }
    });

    window.addEventListener("DOMContentLoaded", loadProfileForEdit);
  </script>
</body>
</html>
