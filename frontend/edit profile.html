<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>G Lab — Edit Profile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    html {
      overflow-y: scroll;
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .edit-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 35px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .edit-card h2 {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .preview-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
      margin-bottom: 10px;
      display: block;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background: none;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: #334155;
    }

    #msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .msg.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      border: 1px solid var(--success-color);
    }

    .msg.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }

    .msg.loading {
      display: block;
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }
  </style>
</head>

<body>
  <div class="edit-card">
    <h2>Edit Profile</h2>

    <form id="editProfileForm">
      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
      </div>

      <div class="form-group">
        <label for="lastname">Last Name</label>
        <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
      </div>

      <div class="form-group">
        <label for="Email">Email Address</label>
        <input type="email" id="Email" name="Email" placeholder="email@example.com" required>
      </div>

      <div class="form-group">
        <label for="avatar">Profile Picture URL</label>
        <input type="text" id="avatar" name="avatar" placeholder="https://example.com/image.jpg">
      </div>

      <div id="profileMsg" class="msg"></div>

      <div class="action-buttons">
        <button type="button" class="btn btn-outline" onclick="window.location.href='profile.html'">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Profile</button>
      </div>
    </form>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0 25px 0;">

    <form id="updateAddressForm">
      <h3 style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 18px; text-align: center;">📍 Shipping Address</h3>

      <div class="form-group">
        <label for="addressLine">Address Line</label>
        <input type="text" id="addressLine" name="addressLine" placeholder="e.g. 123 Main Street">
      </div>

      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="e.g. Colombo">
      </div>

      <div class="form-group">
        <label for="district">District</label>
        <input type="text" id="district" name="district" placeholder="e.g. Colombo">
      </div>

      <div class="form-group">
        <label for="postalCode">Postal Code</label>
        <input type="text" id="postalCode" name="postalCode" placeholder="e.g. 00100">
      </div>

      <div id="addressMsg" class="msg"></div>

      <div class="action-buttons" style="margin-top: 15px;">
        <button type="submit" class="btn btn-primary" id="saveAddressBtn">Save Address</button>
      </div>
    </form>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0 25px 0;">

    <form id="changePasswordForm">
      <h3 style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 18px; text-align: center;">🔒 Change
        Password</h3>

      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password"
          required>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
      </div>

      <div id="passwordMsg" class="msg"></div>

      <div class="action-buttons" style="margin-top: 15px;">
        <button type="submit" class="btn btn-primary" id="changePassBtn">Update Password</button>
      </div>
    </form>
  </div>

  <script>
    const API_URL = "http://192.168.1.36:3001";
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "First login page.html";
    }

    async function loadProfileForEdit() {
      try {
        const response = await fetch(`${API_URL}/users/profile`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await response.json();
        if (response.ok && data.user) {
          populateFields(data.user);
          localStorage.setItem("user", JSON.stringify(data.user));
        } else {
          loadFromLocal();
        }
      } catch (err) {
        console.error("Error fetching profile for edit:", err);
        loadFromLocal();
      }
    }

    function loadFromLocal() {
      try {
        const rawUser = localStorage.getItem("user");
        if (rawUser) {
          populateFields(JSON.parse(rawUser));
        }
      } catch (e) { }
    }

    function populateFields(user) {
      document.getElementById("firstname").value = user.firstname || "";
      document.getElementById("lastname").value = user.lastname || "";
      document.getElementById("Email").value = user.email || "";
      document.getElementById("avatar").value = user.Image || user.image || user.avatar || user.profilePic || "";

      const addr = user.address || {};
      document.getElementById("addressLine").value = addr.addressLine || "";
      document.getElementById("city").value = addr.city || "";
      document.getElementById("district").value = addr.district || "";
      document.getElementById("postalCode").value = addr.postalCode || "";
    }

    function showMsg(elemId, text, type) {
      const msg = document.getElementById(elemId);
      if (!msg) return;
      msg.textContent = text;
      msg.className = `msg ${type}`;
    }

    // Handle Edit Profile submission (PUT /users/profile)
    document.getElementById("editProfileForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const firstname = document.getElementById("firstname").value.trim();
      const lastname = document.getElementById("lastname").value.trim();
      const email = document.getElementById("Email").value.trim();
      const image = document.getElementById("avatar").value.trim();

      const saveBtn = document.getElementById("saveProfileBtn");
      saveBtn.disabled = true;
      showMsg("profileMsg", "Saving profile...", "loading");

      try {
        const response = await fetch(`${API_URL}/users/profile`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ firstname, lastname, email, image })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || `Update failed (${response.status})`);
        }

        if (data.user) {
          localStorage.setItem("user", JSON.stringify(data.user));
        }

        showMsg("profileMsg", "Profile updated successfully! Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "profile.html";
        }, 800);

      } catch (err) {
        console.error("Update profile error:", err);
        showMsg("profileMsg", `Error: ${err.message}`, "error");
        saveBtn.disabled = false;
      }
    });

    // Handle Update Address submission (PUT /users/address)
    document.getElementById("updateAddressForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const addressLine = document.getElementById("addressLine").value.trim();
      const city = document.getElementById("city").value.trim();
      const district = document.getElementById("district").value.trim();
      const postalCode = document.getElementById("postalCode").value.trim();

      const saveBtn = document.getElementById("saveAddressBtn");
      saveBtn.disabled = true;
      showMsg("addressMsg", "Saving address...", "loading");

      try {
        const response = await fetch(`${API_URL}/users/address`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ addressLine, city, district, postalCode })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || `Address update failed (${response.status})`);
        }

        // Update local user object address property
        try {
          const rawUser = localStorage.getItem("user");
          if (rawUser) {
            const u = JSON.parse(rawUser);
            u.address = data.address || { addressLine, city, district, postalCode };
            localStorage.setItem("user", JSON.stringify(u));
          }
        } catch (e) {}

        showMsg("addressMsg", "Address updated successfully!", "success");

      } catch (err) {
        console.error("Update address error:", err);
        showMsg("addressMsg", `Error: ${err.message}`, "error");
      } finally {
        saveBtn.disabled = false;
      }
    });

    // Handle Change Password submission (PUT /users/change-password)
    document.getElementById("changePasswordForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const currentPassword = document.getElementById("currentPassword").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      const passBtn = document.getElementById("changePassBtn");

      if (!currentPassword || !newPassword) {
        showMsg("passwordMsg", "Current password and new password are required", "error");
        return;
      }

      passBtn.disabled = true;
      showMsg("passwordMsg", "Updating password...", "loading");

      try {
        const response = await fetch(`${API_URL}/users/change-password`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || `Password update failed (${response.status})`);
        }

        showMsg("passwordMsg", "Password changed successfully!", "success");
        document.getElementById("changePasswordForm").reset();

      } catch (err) {
        console.error("Change password error:", err);
        showMsg("passwordMsg", err.message, "error");
      } finally {
        passBtn.disabled = false;
      }
    });

    window.addEventListener("DOMContentLoaded", loadProfileForEdit);
  </script>
</body>

</html>
