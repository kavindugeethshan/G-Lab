<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>G Lab — My Profile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --error-color: #ef4444;
    }

    html {
      overflow-y: scroll;
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .profile-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 35px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      margin-bottom: 12px;
      background-color: #0f172a;
    }

    .profile-header h2 {
      font-size: 1.5rem;
      color: var(--text-main);
    }

    .profile-header span {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 10px;
      background-color: #334155;
      color: var(--accent-color);
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .info-group {
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .info-group:last-of-type {
      border-bottom: none;
    }

    .info-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background: none;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: #334155;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--error-color);
      border-color: var(--error-color);
    }

    .btn-danger:hover {
      background-color: var(--error-color);
      color: white;
    }
  </style>
</head>

<body>
  <div class="profile-card">
    <div class="profile-header">
      <img id="profilePic" class="avatar" src="https://via.placeholder.com/100?text=User" alt="Profile Picture">
      <h2 id="userName">User Profile</h2>
      <span id="userRole">Customer</span>
    </div>

    <div class="info-group">
      <div class="info-label">First Name</div>
      <div class="info-value" id="userFirstName">-</div>
    </div>

    <div class="info-group">
      <div class="info-label">Last Name</div>
      <div class="info-value" id="userLastName">-</div>
    </div>

    <div class="info-group">
      <div class="info-label">Email Address</div>
      <div class="info-value" id="userEmail">-</div>
    </div>

    <div class="info-group">
      <div class="info-label">Address</div>
      <div class="info-value" id="userAddress">Not provided</div>
    </div>

    <div class="action-buttons">
      <button type="button" class="btn btn-outline" onclick="window.location.href='home.html'">Products</button>
      <button type="button" class="btn btn-primary" onclick="window.location.href='edit profile.html'">Edit
        Profile</button>
      <button type="button" class="btn btn-outline" id="adminProfileBtn"
        style="display: none; border-color: var(--accent-color); color: var(--accent-color);"
        onclick="window.location.href='admin.html'">Admin Panel</button>
      <button type="button" class="btn btn-outline" onclick="logout()">Log Out</button>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0 20px 0;">

    <div class="danger-section" style="text-align: center;">
      <h3 style="font-size: 0.95rem; color: var(--error-color); margin-bottom: 8px;">⚠️ Delete Account</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Permanently delete your account and
        all associated data.</p>
      <button type="button" class="btn btn-danger" style="width: 100%;" onclick="deleteAccount()">Delete
        Account</button>
    </div>
  </div>

  <script>
    const API_URL = "http://192.168.1.36:3001";
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "First login page.html";
    }

    async function loadUserProfile() {
      try {
        const response = await fetch(`${API_URL}/users/profile`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (response.ok && data.user) {
          localStorage.setItem("user", JSON.stringify(data.user));
          renderProfile(data.user);
        } else {
          loadFromLocalStorage();
        }
      } catch (err) {
        console.error("Error fetching profile from server:", err);
        loadFromLocalStorage();
      }
    }

    function loadFromLocalStorage() {
      try {
        const rawUser = localStorage.getItem("user");
        if (rawUser) {
          renderProfile(JSON.parse(rawUser));
        }
      } catch (e) {
        console.error("Error loading local user:", e);
      }
    }

    function renderProfile(user) {
      const fullName = `${user.firstname || ''} ${user.lastname || ''}`.trim() || user.email || 'User Profile';
      document.getElementById("userName").textContent = fullName;
      document.getElementById("userFirstName").textContent = user.firstname || "-";
      document.getElementById("userLastName").textContent = user.lastname || "-";
      document.getElementById("userEmail").textContent = user.email || "-";
      document.getElementById("userRole").textContent = user.isadmin ? "Admin" : "Customer";

      const addr = user.address || {};
      const fullAddress = [addr.addressLine, addr.city, addr.district, addr.postalCode].filter(Boolean).join(", ");
      document.getElementById("userAddress").textContent = fullAddress || "Not provided";

      if (user.isadmin) {
        const btn = document.getElementById("adminProfileBtn");
        if (btn) btn.style.display = "inline-block";
      }

      const pic = document.getElementById("profilePic");
      const imgUrl = user.Image || user.image || user.avatar || user.profilePic;
      if (imgUrl) {
        pic.src = imgUrl;
      } else {
        pic.src = "https://via.placeholder.com/100?text=User";
      }
    }

    async function deleteAccount() {
      const confirmDelete = confirm("Are you sure you want to delete your account? This action is permanent and cannot be undone.");
      if (!confirmDelete) return;

      try {
        const response = await fetch(`${API_URL}/users/delete-account`, {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || `Failed to delete account (${response.status})`);
        }

        alert("Your account has been deleted successfully.");
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "First login page.html";

      } catch (err) {
        console.error("Delete account error:", err);
        alert(`Error deleting account: ${err.message}`);
      }
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "First login page.html";
    }

    window.addEventListener("DOMContentLoaded", loadUserProfile);
  </script>
</body>

</html>
