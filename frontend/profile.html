<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>G Lab — User Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060b18;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(59, 130, 246, 0.25);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 38px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin-bottom: 12px;
            background-color: #0f172a;
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .profile-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .badge-role {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 12px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .badge-admin {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border-color: rgba(168, 85, 247, 0.4);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 26px;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            text-align: center;
            transition: all 0.25s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: rgba(30, 41, 59, 0.6);
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .btn-danger:hover {
            background: var(--error-color);
            color: white;
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }

            .profile-card {
                padding: 24px 18px;
                border-radius: 18px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 14px;
            }

            .info-value {
                word-break: break-all;
            }
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <div class="profile-header">
            <img id="userAvatar" class="avatar" src="https://via.placeholder.com/95?text=User" alt="User Avatar" onerror="this.src='https://via.placeholder.com/95?text=User'">
            <h2 id="userName">Loading profile...</h2>
            <span class="badge-role" id="userRole">Customer</span>
        </div>

        <div class="info-grid">
            <div class="info-group">
                <span class="info-label">First Name</span>
                <span class="info-value" id="infoFirstName">—</span>
            </div>
            <div class="info-group">
                <span class="info-label">Last Name</span>
                <span class="info-value" id="infoLastName">—</span>
            </div>
            <div class="info-group" style="grid-column: span 2;">
                <span class="info-label">Email Address</span>
                <span class="info-value" id="infoEmail">—</span>
            </div>
            <div class="info-group" style="grid-column: span 2;">
                <span class="info-label">Delivery Address</span>
                <span class="info-value" id="infoAddress">Not provided</span>
            </div>
            <div class="info-group" style="grid-column: span 2;">
                <span class="info-label">Account Created</span>
                <span class="info-value" id="infoCreatedAt">—</span>
            </div>
        </div>

        <div class="action-buttons">
            <button type="button" class="btn btn-primary" onclick="window.location.href='edit profile.html'">✏️ Edit Profile & Address</button>
            <button type="button" class="btn btn-outline" onclick="window.location.href='home.html'">🏠 Back to Store</button>
            <button type="button" class="btn btn-danger" onclick="logout()">Logout Account</button>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script>
        const API_URL = window.API_URL || (
            (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:3001'
                : window.location.origin
        );

        const token = localStorage.getItem("token");
        if (!token) window.location.href = "index.html";

        async function fetchProfile() {
            try {
                const res = await fetch(`${API_URL}/users/profile`, {
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Failed to load profile");

                const u = data.user || data;
                document.getElementById("userName").textContent = `${u.firstname || ''} ${u.lastname || ''}`.trim() || u.email;
                document.getElementById("infoFirstName").textContent = u.firstname || '—';
                document.getElementById("infoLastName").textContent = u.lastname || '—';
                document.getElementById("infoEmail").textContent = u.email || '—';

                const avatarEl = document.getElementById("userAvatar");
                if (u.Image || u.image) avatarEl.src = u.Image || u.image;

                const roleEl = document.getElementById("userRole");
                if (u.isadmin) {
                    roleEl.textContent = "Administrator";
                    roleEl.className = "badge-role badge-admin";
                } else {
                    roleEl.textContent = "Customer Account";
                }

                const addr = u.address || {};
                const addrStr = [addr.addressLine, addr.city, addr.district, addr.postalCode].filter(Boolean).join(", ");
                document.getElementById("infoAddress").textContent = addrStr || "No address provided (Edit profile to add address)";
                document.getElementById("infoCreatedAt").textContent = u.createdAt ? new Date(u.createdAt).toLocaleString() : '—';

                localStorage.setItem("user", JSON.stringify(u));

            } catch (err) {
                console.error("fetchProfile error:", err);
                alert(`Session error: ${err.message}`);
                logout();
            }
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }

        window.addEventListener("DOMContentLoaded", fetchProfile);
    </script>
</body>

</html>
