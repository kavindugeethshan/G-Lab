<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Lab — Product Details & Reviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060b18;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(59, 130, 246, 0.25);
            --card-hover-border: rgba(99, 102, 241, 0.5);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.7);
        }

        html {
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* HEADER & NAVIGATION */
        header {
            background-color: rgba(10, 17, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: rgba(30, 41, 59, 0.5);
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(148, 163, 184, 0.4);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--error-color);
            color: white;
        }

        /* CONTAINER & DETAIL LAYOUT */
        .container {
            max-width: 1080px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .detail-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 36px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 36px;
            margin-bottom: 32px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .detail-card {
                grid-template-columns: 1fr;
            }
        }

        .product-img-wrapper {
            position: relative;
            background: #0f172a;
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .product-img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .discount-badge {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(239, 68, 68, 0.85);
            color: white;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .stock-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 14px;
            display: inline-block;
        }

        .stock-in { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .stock-low { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .stock-out { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .product-badge {
            font-size: 0.78rem;
            background: rgba(51, 65, 85, 0.6);
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            margin-right: 6px;
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 10px 0 12px 0;
            line-height: 1.2;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 18px;
        }

        .price-current {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--success-color);
        }

        .price-original {
            font-size: 1rem;
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        /* REVIEWS SECTION */
        .review-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 34px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
        }

        .review-section h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .review-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .review-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .review-author {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .review-stars {
            color: #f59e0b;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .review-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.84rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group textarea,
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 0.92rem;
            font-family: inherit;
            margin-bottom: 14px;
        }

        #message {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            font-size: 0.9rem;
        }

        #message.error { display: block; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        #message.success { display: block; background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        #message.loading { display: block; background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .logo-text h1 {
                font-size: 1.2rem;
            }

            .container {
                padding: 0 14px;
                margin: 20px auto;
            }

            .detail-card {
                padding: 20px;
                gap: 20px;
            }

            .product-img-wrapper {
                min-height: 220px;
            }

            .product-img {
                max-height: 200px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 10px 12px;
            }

            .nav-actions {
                width: 100%;
                justify-content: space-between;
            }

            .btn {
                padding: 8px 12px;
                font-size: 0.82rem;
            }

            .detail-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-title" onclick="window.location.href='home.html'">
            <div class="logo-icon">G</div>
            <div class="logo-text">
                <h1>G LAB</h1>
                <span>Product Specifications & Reviews</span>
            </div>
        </div>
        <div class="nav-actions">
            <button type="button" class="btn btn-outline" onclick="window.location.href='home.html'">🏠 Back to Store</button>
            <button type="button" class="btn btn-primary" onclick="window.location.href='cart.html'">🛒 Cart</button>
        </div>
    </header>

    <div class="container">
        <div id="message"></div>
        <div id="productDetailContainer">
            <p style="text-align: center; color: var(--text-muted); padding: 50px;">Loading product specifications...</p>
        </div>
    </div>

    <script>
        const API_URL = (window.location.protocol.startsWith('http')) 
            ? `${window.location.protocol}//${window.location.hostname}:3001` 
            : "http://localhost:3001";

        const token = localStorage.getItem("token");
        const rawUser = localStorage.getItem("user");
        let currentUserId = null;

        if (rawUser) {
            try {
                const u = JSON.parse(rawUser);
                currentUserId = u._id || u.id;
            } catch (_) {}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get("id");

        function getHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        function setMessage(text, type) {
            const el = document.getElementById("message");
            if (!text) { el.style.display = "none"; return; }
            el.textContent = text;
            el.className = type || "";
            if (type === "success") {
                setTimeout(() => { if (el.textContent === text) el.style.display = "none"; }, 4000);
            }
        }

        async function loadProductDetail() {
            if (!productId) {
                document.getElementById("productDetailContainer").innerHTML = `<p style="color: var(--error-color); text-align: center;">No Product ID specified in URL.</p>`;
                return;
            }

            try {
                const res = await fetch(`${API_URL}/products/${productId}`);
                const data = await res.json();

                if (!res.ok) throw new Error(data.message || "Product not found");

                const p = data.product || data;
                renderProduct(p);
                loadReviews();

            } catch (err) {
                console.error("loadProductDetail error:", err);
                document.getElementById("productDetailContainer").innerHTML = `<p style="color: var(--error-color); text-align: center;">Error loading product: ${err.message}</p>`;
            }
        }

        function renderProduct(p) {
            const container = document.getElementById("productDetailContainer");
            const origPrice = p.price || 0;
            const discount = p.discount || 0;
            const discPrice = discount > 0 ? Math.round(origPrice * (1 - discount / 100)) : origPrice;
            const stock = p.stock !== undefined ? p.stock : 0;
            const img = p.Image || p.image || 'https://via.placeholder.com/300x250?text=No+Image';

            let stockClass = 'stock-in';
            let stockText = `In Stock (${stock} units)`;
            if (stock === 0) { stockClass = 'stock-out'; stockText = 'Out of Stock'; }
            else if (stock <= 5) { stockClass = 'stock-low'; stockText = `Low Stock (${stock} remaining)`; }

            container.innerHTML = `
                <div class="detail-card">
                    <div class="product-img-wrapper">
                        <img src="${img}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x250?text=No+Image'">
                        ${discount > 0 ? `<span class="discount-badge">-${discount}% OFF</span>` : ''}
                    </div>
                    <div>
                        <div>
                            <span class="product-badge">${p.category || 'Hardware'}</span>
                            <span class="product-badge">${p.brand || 'Brand'}</span>
                            <span class="stock-badge ${stockClass}">${stockText}</span>
                        </div>
                        <h2 class="title">${p.name}</h2>
                        <div class="price-box">
                            <span class="price-current">Rs. ${discPrice.toLocaleString()}</span>
                            ${discount > 0 ? `<span class="price-original">Rs. ${origPrice.toLocaleString()}</span>` : ''}
                        </div>
                        <p class="desc">${p.description || 'No description available for this product.'}</p>
                        
                        <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 20px;">
                            <div style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 6px;">Product ID: <strong style="color: var(--text-main); font-family: monospace;">${p._id}</strong></div>
                            <div style="font-size: 0.88rem; color: var(--text-muted);">Overall Customer Rating: <strong style="color: #f59e0b;" id="avgRatingVal">Loading...</strong></div>
                        </div>

                        <div style="display: flex; gap: 12px; align-items: center;">
                            <input type="number" id="purchaseQty" value="1" min="1" max="${stock}" style="width: 70px; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(15,23,42,0.8); color: white; text-align: center; font-weight: 700;">
                            <button type="button" class="btn btn-primary" style="flex: 1; padding: 14px;" onclick="addToCartDetail('${p._id}')" ${stock === 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                                🛒 Add to Cart Now
                            </button>
                        </div>
                    </div>
                </div>

                <div class="review-section">
                    <h3>
                        <span>⭐ Customer Reviews & Feedback</span>
                        <span style="font-size: 0.88rem; font-weight: 500; color: var(--text-muted);" id="reviewCountHeader">0 Reviews</span>
                    </h3>
                    
                    <!-- Review Submission Form -->
                    <div style="background: rgba(15,23,42,0.75); border: 1px solid var(--border-color); padding: 22px; border-radius: 14px; margin-bottom: 26px;">
                        <h4 style="font-size: 1.05rem; margin-bottom: 14px; font-family: 'Outfit', sans-serif;">Write a Review for this Product</h4>
                        <div class="form-group">
                            <label>Rating (1 to 5 Stars) *</label>
                            <select id="newReviewRating">
                                <option value="5">⭐⭐⭐⭐⭐ (5/5 Stars)</option>
                                <option value="4">⭐⭐⭐⭐ (4/5 Stars)</option>
                                <option value="3">⭐⭐⭐ (3/5 Stars)</option>
                                <option value="2">⭐⭐ (2/5 Stars)</option>
                                <option value="1">⭐ (1/5 Star)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Review Comment *</label>
                            <textarea id="newReviewComment" rows="3" placeholder="Share your experience with this product..."></textarea>
                        </div>
                        <button type="button" class="btn btn-primary" onclick="submitReview()">Submit Review</button>
                    </div>

                    <div id="reviewsList">
                        <p style="color: var(--text-muted);">Loading reviews...</p>
                    </div>
                </div>
            `;

            // Load Rating Information (GET /products/:productId/rating)
            fetch(`${API_URL}/products/${p._id}/rating`)
                .then(res => res.json())
                .then(data => {
                    const el = document.getElementById("avgRatingVal");
                    if (el) {
                        const avg = data.ratingAverage !== undefined ? data.ratingAverage : 0;
                        const cnt = data.ratingCount !== undefined ? data.ratingCount : 0;
                        el.textContent = `${avg} / 5 (${cnt} rating(s))`;
                    }
                }).catch(() => {});
        }

        async function addToCartDetail(pId) {
            if (!token) { alert("Please log in to add items to your cart."); return; }
            const qty = Number(document.getElementById("purchaseQty").value) || 1;
            setMessage("Adding product to cart...", "loading");

            try {
                const res = await fetch(`${API_URL}/cart/add`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({ productId: pId, quantity: qty })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Failed to add to cart");

                setMessage("Product added to cart! 🛒", "success");
            } catch (err) {
                setMessage(`Add to cart failed: ${err.message}`, "error");
            }
        }

        // 3. GET PRODUCT REVIEWS (GET /products/:productId/reviews)
        async function loadReviews() {
            try {
                const res = await fetch(`${API_URL}/products/${productId}/reviews`);
                const data = await res.json();
                const reviews = data.reviews || [];

                const countHeader = document.getElementById("reviewCountHeader");
                if (countHeader) countHeader.textContent = `${reviews.length} Review(s)`;

                const container = document.getElementById("reviewsList");
                if (!reviews || reviews.length === 0) {
                    container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">No customer reviews yet. Be the first to share your feedback!</p>`;
                    return;
                }

                container.innerHTML = reviews.map(r => {
                    const reviewer = r.user || {};
                    const reviewerId = reviewer._id || (typeof r.user === 'string' ? r.user : null);
                    const isOwnReview = currentUserId && reviewerId && (currentUserId.toString() === reviewerId.toString());
                    const reviewerName = `${reviewer.firstname || ''} ${reviewer.lastname || ''}`.trim() || reviewer.email || 'Verified Buyer';
                    const reviewDate = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '';

                    return `
                        <div class="review-card" id="review-card-${r._id}">
                            <div class="review-header">
                                <span class="review-author">
                                    👤 <strong>${reviewerName}</strong>
                                    ${isOwnReview ? `<span style="font-size: 0.72rem; background: rgba(59,130,246,0.2); color: #60a5fa; padding: 2px 8px; border-radius: 6px;">Your Review</span>` : ''}
                                </span>
                                <div>
                                    <span class="review-stars">⭐ ${r.rating} / 5</span>
                                    <span style="font-size: 0.78rem; color: var(--text-muted); margin-left: 8px;">${reviewDate}</span>
                                </div>
                            </div>
                            <p style="font-size: 0.92rem; color: var(--text-muted); line-height: 1.5;" id="review-comment-${r._id}">${r.comment || 'No text comment.'}</p>
                            
                            <!-- Inline Edit Box (hidden by default) -->
                            <div id="edit-box-${r._id}" style="display: none; margin-top: 14px; background: rgba(15,23,42,0.8); padding: 14px; border-radius: 10px; border: 1px solid var(--border-color);">
                                <label style="font-size: 0.8rem; color: var(--text-muted);">Update Rating:</label>
                                <select id="edit-rating-${r._id}" style="margin-bottom: 8px;">
                                    <option value="5" ${r.rating === 5 ? 'selected' : ''}>⭐⭐⭐⭐⭐ (5/5)</option>
                                    <option value="4" ${r.rating === 4 ? 'selected' : ''}>⭐⭐⭐⭐ (4/5)</option>
                                    <option value="3" ${r.rating === 3 ? 'selected' : ''}>⭐⭐⭐ (3/5)</option>
                                    <option value="2" ${r.rating === 2 ? 'selected' : ''}>⭐⭐ (2/5)</option>
                                    <option value="1" ${r.rating === 1 ? 'selected' : ''}>⭐ (1/5)</option>
                                </select>
                                <label style="font-size: 0.8rem; color: var(--text-muted);">Update Comment:</label>
                                <textarea id="edit-comment-${r._id}" rows="2">${r.comment || ''}</textarea>
                                <div style="display: flex; gap: 8px;">
                                    <button class="btn btn-primary" style="padding: 6px 14px; font-size: 0.8rem;" onclick="submitUpdateReview('${r._id}')">Save Changes</button>
                                    <button class="btn btn-outline" style="padding: 6px 14px; font-size: 0.8rem;" onclick="toggleEditBox('${r._id}')">Cancel</button>
                                </div>
                            </div>

                            ${isOwnReview ? `
                                <div class="review-actions">
                                    <button type="button" class="btn btn-outline" style="padding: 4px 12px; font-size: 0.78rem;" onclick="toggleEditBox('${r._id}')">✏️ Edit</button>
                                    <button type="button" class="btn btn-danger" style="padding: 4px 12px; font-size: 0.78rem;" onclick="deleteOwnReview('${r._id}')">🗑️ Delete</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

            } catch (_) {
                document.getElementById("reviewsList").innerHTML = `<p style="color: var(--text-muted);">Failed to load reviews.</p>`;
            }
        }

        // 1. CREATE REVIEW (POST /products/:productId/reviews)
        async function submitReview() {
            if (!token) { alert("Please log in to submit a review."); return; }

            const rating = Number(document.getElementById("newReviewRating").value);
            const comment = document.getElementById("newReviewComment").value.trim();

            if (!comment) {
                setMessage("Please write a comment for your review.", "error");
                return;
            }

            setMessage("Submitting your review...", "loading");
            try {
                const res = await fetch(`${API_URL}/products/${productId}/reviews`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({ rating, comment })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Failed to submit review");

                setMessage("🎉 Review posted successfully! Rating updated.", "success");
                document.getElementById("newReviewComment").value = "";
                loadReviews();
                loadProductDetail();

            } catch (err) {
                setMessage(`Submit failed: ${err.message}`, "error");
            }
        }

        function toggleEditBox(reviewId) {
            const box = document.getElementById(`edit-box-${reviewId}`);
            if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        // 4. UPDATE OWN REVIEW (PUT /reviews/:id)
        async function submitUpdateReview(reviewId) {
            const rating = Number(document.getElementById(`edit-rating-${reviewId}`).value);
            const comment = document.getElementById(`edit-comment-${reviewId}`).value.trim();

            if (!comment) {
                setMessage("Review comment cannot be empty.", "error");
                return;
            }

            setMessage("Updating review...", "loading");
            try {
                const res = await fetch(`${API_URL}/reviews/${reviewId}`, {
                    method: "PUT",
                    headers: getHeaders(),
                    body: JSON.stringify({ rating, comment })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Update failed");

                setMessage("Review updated successfully!", "success");
                loadReviews();
                loadProductDetail();

            } catch (err) {
                setMessage(`Update failed: ${err.message}`, "error");
            }
        }

        // 5. DELETE OWN REVIEW (DELETE /reviews/:id)
        async function deleteOwnReview(reviewId) {
            if (!confirm("Are you sure you want to delete your review? The product's rating will be recalculated.")) return;

            setMessage("Deleting review...", "loading");
            try {
                const res = await fetch(`${API_URL}/reviews/${reviewId}`, {
                    method: "DELETE",
                    headers: getHeaders()
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Delete failed");

                setMessage("Review deleted successfully!", "success");
                loadReviews();
                loadProductDetail();

            } catch (err) {
                setMessage(`Delete failed: ${err.message}`, "error");
            }
        }

        window.addEventListener("DOMContentLoaded", loadProductDetail);
    </script>
</body>

</html>
