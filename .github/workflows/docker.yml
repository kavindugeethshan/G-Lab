name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    name: Build, Push and Deploy
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest

      - name: Deploy container
        run: |
          docker stop g-lab-backend || true
          docker rm g-lab-backend || true

          docker run -d \
            --name g-lab-backend \
            -p 3001:3001 \
            --env-file /home/prabavi/.env \
            ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest